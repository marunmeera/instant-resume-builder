<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Resume — Instant Resume Builder</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<header class="top"><div class="brand"><h1>Instant Resume Builder</h1></div></header>

<div class="shell">
  <div class="result-card">
    <h2>Your resume is ready 🎉</h2>
    <div id="resumePreview"></div>
    <div class="download-actions" id="downloadActions"></div>
    <p class="trust" style="margin-top:18px;"><a href="index.html">← Build another resume</a></p>
  </div>
</div>

<script>
const resumeOutput = localStorage.getItem("resumeOutput");
const paidType = JSON.parse(localStorage.getItem("lastPaidType") || '"basic"');

if (!resumeOutput) window.location.href = "index.html";

const parser = new DOMParser();
const doc = parser.parseFromString(resumeOutput, "text/html");
const styleTag = doc.querySelector("style");
const bodyContent = doc.body ? doc.body.innerHTML : resumeOutput;
document.getElementById("resumePreview").innerHTML = (styleTag ? styleTag.outerHTML : "") + bodyContent;

const actions = document.getElementById("downloadActions");
let buttonsHtml = `<button class="pay-btn" onclick="downloadPDF()">⬇ Download PDF</button>`;
if (paidType === "moderate" || paidType === "experienced") {
  buttonsHtml += `<button class="pay-btn" onclick="downloadWord()">⬇ Download Word (.doc)</button>`;
}
actions.innerHTML = buttonsHtml;

function downloadPDF(){
  const el = document.getElementById("resumePreview");
  const prevMaxHeight = el.style.maxHeight;
  const prevOverflow = el.style.overflow;
  el.style.maxHeight = "none";
  el.style.overflow = "visible";
  el.scrollTop = 0;
  window.scrollTo(0, 0);

  // Wait for every image inside (photo, if any) to actually finish decoding —
  // capturing before an image loads is what was causing blank/cut-off PDFs.
  const images = [...el.querySelectorAll("img")];
  const imgReady = images.map(img => img.complete ? Promise.resolve() : new Promise(res => {
    img.onload = res; img.onerror = res;
  }));

  Promise.all(imgReady).then(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        html2pdf().set({
          margin: 10, filename: "resume.pdf",
          image: { type: "jpeg", quality: 0.98 },
          html2canvas: {
            scale: 2, useCORS: true, scrollX: 0, scrollY: 0,
            windowWidth: document.documentElement.scrollWidth,
            windowHeight: el.scrollHeight + 100
          },
          jsPDF: { unit: "pt", format: "a4", orientation: "portrait" },
          pagebreak: { mode: ["css", "legacy"] }
        }).from(el).save().then(()=>{
          el.style.maxHeight = prevMaxHeight;
          el.style.overflow = prevOverflow;
        });
      }, 150);
    });
  });
}

function downloadWord(){
  const preHtml = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Resume</title></head><body>`;
  const postHtml = "</body></html>";
  // Word's HTML import doesn't reliably render base64-embedded images, so we
  // strip the photo for this format specifically (it still shows fine in the PDF).
  const clone = document.getElementById("resumePreview").cloneNode(true);
  clone.querySelectorAll("img").forEach(img => img.remove());
  const html = preHtml + clone.innerHTML + postHtml;
  const blob = new Blob(['\ufeff', html], { type: "application/msword" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "resume.doc";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
